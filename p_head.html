<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>无人机综合防控系统</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#f5f5f0;--bg2:#fafaf7;--bg3:#f0f0eb;
  --fg:#1a1a1e;--fg2:#55555e;--fg3:#888891;
  --ac:#0099cc;--ac2:#cc5522;--ac3:#22aa66;--rd:#cc2244;--yl:#bb8800;
  --bd:#cdcdc0;--bd2:#b0b0a4;
  --mo:"Cascadia Code","JetBrains Mono","Consolas",monospace;
  --sf:"Inter","SF Pro","PingFang SC","Microsoft YaHei",sans-serif
}
html,body{width:100%;height:100%;overflow:hidden}
body{font-family:var(--sf);background:var(--bg);color:var(--fg);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:
    linear-gradient(rgba(0,0,0,.04) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,0,0,.04) 1px,transparent 1px);
  background-size:52px 52px
}
body::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse 50vw 40vh at 20% 50%,rgba(0,180,220,.04) 0%,transparent 70%),
             radial-gradient(ellipse 50vw 40vh at 80% 30%,rgba(220,80,30,.03) 0%,transparent 70%)
}
.slides{width:100%;height:100%;position:relative;z-index:1}
.slide{position:absolute;inset:0;display:none;opacity:0;transition:opacity .35s;padding:38px 48px 70px;overflow-y:auto}
.slide.active{display:flex;flex-direction:column;opacity:1}
.sc{justify-content:center;align-items:center;text-align:center}
.h1{font-size:clamp(1.8rem,3vw,2.8rem);font-weight:800;color:var(--ac);margin-bottom:6px;letter-spacing:1px}
.h2{font-size:clamp(1.15rem,1.8vw,1.55rem);font-weight:700;color:var(--ac);margin-bottom:3px;letter-spacing:.4px}
.sub{color:var(--fg2);font-size:.85rem;margin-bottom:14px}
.kpi{font-size:clamp(1.5rem,2.6vw,2rem);font-weight:700;color:var(--ac)}.kpi-o{color:var(--ac2)}.kpi-g{color:var(--ac3)}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.75rem;font-weight:500;margin:2px 3px;background:rgba(0,153,204,.08);border:1px solid rgba(0,153,204,.3);color:var(--ac)}
.to{background:rgba(204,85,34,.08);border-color:rgba(204,85,34,.3);color:var(--ac2)}
.tr{background:rgba(204,34,68,.08);border-color:rgba(204,34,68,.3);color:var(--rd)}
.tg{background:rgba(34,170,102,.08);border-color:rgba(34,170,102,.3);color:var(--ac3)}
.ty{background:rgba(187,136,0,.08);border-color:rgba(187,136,0,.3);color:var(--yl)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;width:100%}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;width:100%}
.col{display:flex;flex-direction:column;gap:10px}
.card{background:var(--bg2);border:1px solid var(--bd);border-radius:5px;padding:12px 14px}
.cp{padding:16px 18px}
.ca{border-left:3px solid var(--ac)}.ca2{border-left:3px solid var(--ac2)}.ca3{border-left:3px solid var(--ac3)}
.ct{font-size:.88rem;font-weight:600;color:var(--ac);margin-bottom:5px}
.ul{list-style:none}.ul li{position:relative;padding-left:14px;margin-bottom:3px;font-size:.85rem;line-height:1.4;color:var(--fg2)}
.ul li::before{content:"\2014";position:absolute;left:0;color:var(--ac2);font-weight:700}
.ul-d li{font-size:.8rem;line-height:1.35;margin-bottom:2px}
.flow{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:4px;margin:6px 0}
.fi{background:rgba(0,153,204,.08);border:1px solid rgba(0,153,204,.25);border-radius:4px;padding:6px 10px;font-size:.8rem;color:var(--ac);text-align:center}
.fi .icon{font-size:1.1rem;display:block;margin-bottom:1px}.fi .lb{font-size:.68rem;color:var(--fg2)}
.fa{color:var(--ac2);font-size:.9rem;font-weight:700}.sep{width:100%;height:1px;background:linear-gradient(90deg,var(--bd),transparent);margin:8px 0}
.dv{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;background:var(--bg2);border:1px solid var(--bd);border-radius:5px}
.dvi{width:32px;height:32px;display:flex;align-items:center;justify-content:center;background:rgba(0,153,204,.08);border-radius:4px;font-size:1rem;flex-shrink:0}
.dvb{flex:1}.dvn{font-size:.84rem;font-weight:600;color:var(--ac);margin-bottom:1px}
.dvd{font-size:.76rem;color:var(--fg2);line-height:1.3;margin-bottom:2px}
.dvs{font-size:.72rem;color:var(--fg3);line-height:1.35}.dvs em{color:var(--ac);font-style:normal;font-weight:500}
.tbl{width:100%;border-collapse:collapse;font-size:.78rem}
.tbl th{text-align:left;padding:3px 5px;color:var(--ac);border-bottom:1px solid var(--bd);font-weight:600}
.tbl td{padding:3px 5px;color:var(--fg2);border-bottom:1px solid rgba(205,205,192,.5)}
.tbl tr:last-child td{border:none}
.sl{display:inline-block;font-family:var(--mo);font-size:.68rem;color:var(--fg3);letter-spacing:1px;margin-bottom:3px;background:var(--bg3);padding:2px 7px;border-radius:3px}
.hl{color:var(--ac);font-weight:600}.hlo{color:var(--ac2);font-weight:600}.hlg{color:var(--ac3);font-weight:600}.hlr{color:var(--rd);font-weight:600}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:2px}
.tl{display:inline-block;padding:1px 8px;border-radius:8px;font-size:.74rem;font-weight:600}
.tl-b{background:rgba(0,153,204,.12);color:var(--ac)}.tl-g{background:rgba(34,170,102,.12);color:var(--ac3)}
.tl-y{background:rgba(187,136,0,.12);color:var(--yl)}.tl-r{background:rgba(204,34,68,.12);color:var(--rd)}

/* RADAR */
.radar-w{position:relative;width:200px;height:200px;margin:6px auto;flex-shrink:0}
.radar-c{position:absolute;border:1.5px solid rgba(0,153,204,.3);border-radius:50%;top:50%;left:50%;transform:translate(-50%,-50%)}
.radar-c:nth-child(1){width:100%;height:100%}.radar-c:nth-child(2){width:75%;height:75%}
.radar-c:nth-child(3){width:50%;height:50%}.radar-c:nth-child(4){width:25%;height:25%;border-color:var(--ac)}
.radar-s{position:absolute;width:50%;height:1.5px;background:linear-gradient(90deg,transparent,var(--ac));top:50%;left:50%;transform-origin:left center;animation:radarSweep 3s linear infinite}
.radar-d{position:absolute;width:6px;height:6px;background:var(--ac2);border-radius:50%;animation:blink 2s infinite}
@keyframes radarSweep{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

/* HAND-DRAWN */
.hd-box{background:var(--bg2);border:2px solid var(--bd);border-radius:2px;padding:10px 12px;position:relative}
.hd-box::before{content:"";position:absolute;top:-3px;left:-3px;right:-3px;bottom:-3px;border:1px solid rgba(0,0,0,.06);border-radius:1px;pointer-events:none}
.hd-arrow{display:inline-block;font-size:.9rem;color:var(--ac2);font-weight:700;transform:scaleX(1.2)}
.hd-num{font-family:var(--mo);font-size:1.2rem;font-weight:700;color:var(--ac);opacity:.4;margin-right:6px}
.hd-l{border-left:3px solid var(--ac)}.hd-l2{border-left:3px solid var(--ac2)}

/* NAV */
.nav{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:100;display:flex;gap:5px;align-items:center}
.nb{background:var(--bg3);border:1px solid var(--bd);color:var(--fg2);padding:4px 14px;border-radius:3px;cursor:pointer;font-size:.78rem;transition:all .2s;font-family:var(--sf)}
.nb:hover{background:rgba(0,153,204,.08);border-color:rgba(0,153,204,.2);color:var(--ac)}
.nb:disabled{opacity:.3;cursor:default}
.nc{color:var(--fg3);font-size:.74rem;margin:0 3px;font-family:var(--mo)}
.dots{position:fixed;bottom:20px;left:20px;z-index:100;display:flex;gap:3px}
.dt{width:4px;height:4px;border-radius:50%;background:var(--bd2);cursor:pointer;transition:all .3s}
.dt.active{background:var(--ac);width:12px;border-radius:2px}

@media(max-width:1366px){.slide{padding:28px 32px 60px}.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:1024px){.g2,.g3{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="slides">
